services:
  db:
    image: postgres:16-alpine
    container_name: kannagi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kannagi_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-app_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-app_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-kannagi-api}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-noop}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      APP_BRAND_NAME: ${APP_BRAND_NAME:-Kannagi}
      APP_BRAND_DISPLAY_NAME: ${APP_BRAND_DISPLAY_NAME:-Kannagi}
      APP_BRAND_TAGLINE: ${APP_BRAND_TAGLINE:-}
      APP_CASE_REF_PREFIX: ${APP_CASE_REF_PREFIX:-KN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STORAGE_PATH: /data/storage
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/data/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_APP_NAME: ${VITE_APP_NAME:-Kannagi}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-}
    container_name: kannagi_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  storage_data:
